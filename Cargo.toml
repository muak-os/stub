[package]
name = "stub"
description = "UEFI boot stub for Unified Kernel Images"
edition = "2024"
version = "1.0.0-beta"
license = "Apache-2.0"
repository = "https://github.com/muak-os/stub"
readme = "README.md"
keywords = ["uefi", "boot", "uki", "efi"]
categories = ["os"]

[lib]
name = "stub"
path = "src/lib.rs"

[[bin]]
name = "stub"
path = "src/main.rs"
required-features = ["uefi"]

[dependencies]
# Error handling
anyhow = "1.0"

# Encoding
base64ct = { version = "1.8", features = ["std"] }

# Internal
uki = { git = "https://github.com/muak-os/muak.git", default-features = false }

# System/platform APIs
uefi = "0.37"

# Utilities
object = { version = "0.39", default-features = false, features = ["read", "pe"] }

[features]
default = ["tpm", "muak"]
uefi = []
# TPM2 PCR measurement of UKI sections.
tpm = []
# LUKS key injection from the ESP when TPM sealing is unavailable.
muak = ["tpm"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

absolute_paths = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
else_if_without_else = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
expect_used = "deny"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
host_endian_bytes = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
inline_asm_x86_att_syntax = "warn"
integer_division = "warn"
integer_division_remainder_used = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
map_with_unused_argument_over_ranges = "warn"
mem_forget = "warn"
min_ident_chars = "warn"
missing_assert_message = "warn"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "warn"
modulo_arithmetic = "warn"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
panic = "warn"
panic_in_result_fn = "warn"
pattern_type_mismatch = "warn"
pointer_format = "warn"
precedence_bits = "warn"
pub_use = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_test_prefix = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_inside_block = "warn"
string_slice = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unreachable = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
unused_trait_names = "warn"
unwrap_used = "deny"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"

multiple_crate_versions = "allow"

[lints.rust]
non_ascii_idents = "deny"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = false
lto = false
